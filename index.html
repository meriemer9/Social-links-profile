<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <section class="main_container">
    <div class="info_container">
      <img src="images/avatar-jessica.jpeg" alt="avatar jessica">
      <p id="name" class="info">Jessica Randall</p>
      <p id="address" class="info">London, United Kingdom</p>
      <p class="job">"Front-end developer and avid reader."</p>
    </div>
    <div class="links_container">
      <a href="" >GitHub</a>
      <a href="" >Frontend Mentor</a>
      <a href="" >LinkedIn</a>
      <a href="" >Twitter</a>
      <a href="" >Instagram</a>
    </div>
  </section>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Belhadj Meriem</a>.
  </footer>
</body>
</html>
